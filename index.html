<!DOCTYPE html>
<html>

<head>
    <title>Josias Miller</title>
    <style>
        .site {
            background-image: url('./media/StockSnap_PM7Z5NV0S0.jpg');
            background-size: cover;
            height: 100vh;
            background-repeat: no-repeat;
            background-position: center;

        }

        body {
            margin: 0;
        }

        .menubar {
            background-color: rgb(74, 74, 74);
            width: 100%;
            height: 75px;
            position: fixed;
            top: 0;
            text-align: center;
        }

        .menubar-text {
            text-decoration: none;
            color: #ffffff;
            font-size: 25px;
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);



        }

        .josias {
            text-decoration: none;
            color: rgb(255, 255, 255);
            text-align: center;
            font-size: 50px;
        }
    </style>

</head>

<body>
    <div class="site">
        <div class="menubar">
            <a href="https://josiasmiller.github.io" class="josias">Josias Miller</a>
            <a href="./media/StockSnap_PM7Z5NV0S0.jpg" class="menubar-text">My Work Placeholder</a>
        </div>

    </div>
</body>

</html>
